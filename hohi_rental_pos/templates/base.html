<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ shop.SHOP_NAME }} 出租 POS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">{{ shop.SHOP_NAME }}<small>設備出租 POS</small></a>
  <nav>
    <a href="{{ url_for('order_new') }}" class="btn primary">＋ 新增出租</a>
    <a href="{{ url_for('dashboard') }}">今日總覽</a>
    <a href="{{ url_for('availability') }}">庫存日曆</a>
    <a href="{{ url_for('orders') }}">訂單</a>
    <a href="{{ url_for('equipment') }}">設備</a>
    <a href="{{ url_for('emails') }}">寄信紀錄</a>
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
